<!doctype html><html lang="ru"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Огонь — три стадии</title>
<style>
@font-face{font-family:Nunito;src:url('assets/fonts/ui-kit/nunito/Nunito-variable.ttf')}*{box-sizing:border-box}body{margin:0;padding:24px;background:#20566c;color:#f2fcff;font-family:Nunito,sans-serif}main{max-width:1050px;margin:auto}h1{font-size:27px;margin:0 0 16px}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{border:3px solid #84b4c2;border-radius:22px;background:#c9e6e9;overflow:hidden;color:#17475b;text-align:center}h2{font-size:20px;margin:12px 0 0}canvas{width:100%;display:block}p{font-size:15px;font-weight:800;margin:0 12px 16px;min-height:42px}@media(max-width:650px){body{padding:12px}section{grid-template-columns:1fr}article{max-width:360px;width:100%;margin:auto}}
</style></head><body><main><h1>Огонь · формы I, II и III</h1><section>
<article><h2>I · Огонь</h2><canvas width="640" height="720" data-stage="1"></canvas><p>Обычный слайм с огненным эффектом</p></article>
<article><h2>II · Вулкан</h2><canvas width="640" height="720" data-stage="2"></canvas><p>Кратер, дым и вылетающие камни</p></article>
<article><h2>III · Феникс</h2><canvas width="640" height="720" data-stage="3"></canvas><p>Феникс с огненными частицами</p></article>
</section></main>
<script src="js/config/game-config.js?v=648"></script><script src="js/core/game-assets.js?v=627"></script><script src="js/rendering/slime-avatar.js?v=661"></script><script src="effects-lab/workbench-effects.js?v=661"></script>
<script>
(async()=>{
 await Promise.all([SlimeAvatarRenderer.preloadAppearance({bodyVariant:'fireWarm'}),SlimeAvatarRenderer.preloadAppearance({bodyVariant:'fireVolcano'}),SlimeAvatarRenderer.preloadAppearance({bodyVariant:'fireUltra',fireEyes:true}),MutationEffectDraft.preload({fire:2})]);
 await SlimeAvatarRenderer.whenReady();
 function draw(timestamp){for(const canvas of document.querySelectorAll('canvas')){
  const stage=Number(canvas.dataset.stage),ctx=canvas.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,320,360);
  const state={x:160,y:220,radius:95,timestamp,levels:{fire:stage},effectDetail:1,volcanoPreview:true,bodyTransform:{rotation:0,scaleX:1,scaleY:1}};
  MutationEffectDraft.drawBehind(ctx,state);
  SlimeAvatarRenderer.drawSlimeAvatar(ctx,{x:160,y:220,radius:95,timestamp,appearance:'cute-v2',emotion:'focused',bodyVariant:stage===2?'fireVolcano':stage===3?'fireUltra':'fireWarm',fireEyes:stage===3,irisTint:stage===3?'#ff9a22':''});
  MutationEffectDraft.drawFront(ctx,state);
 }}
 window.fireFormsPreview={draw};window.previewReady=true;
 function frame(t){draw(t);if(!window.previewPaused)requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
