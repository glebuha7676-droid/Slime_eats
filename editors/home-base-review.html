<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Основа главного экрана — примерка</title>
<style>
@font-face{font-family:Nunito;src:url('../assets/fonts/ui-kit/nunito/Nunito-variable.ttf') format('truetype');font-weight:200 1000;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#143c50;color:#edfaff;font-family:Nunito,sans-serif}header{max-width:780px;margin:20px auto;padding:0 16px}h1{margin:0 0 5px;font-size:23px;font-weight:900}p{margin:4px 0 12px;color:#bedce5;font-size:14px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:800 14px Nunito,sans-serif;border:1px solid #759eab;border-radius:10px;padding:8px 12px;color:#17465b;background:#d8edf1;cursor:pointer}button[aria-pressed=true]{background:#a1e5ef;border-color:#cefaff}main{display:flex;justify-content:center;padding:0 12px 24px}.phone{position:relative;width:390px;max-width:100%;aspect-ratio:390/844;overflow:hidden;background:#67a6bb;isolation:isolate}.before{position:absolute;inset:0;width:100%;height:100%;display:block}.base{position:absolute;left:0;top:36.255924%;width:100%;height:63.744076%;display:block;background:#70afc1}.marks{position:absolute;inset:0;display:none;pointer-events:none}.marks span{position:absolute;display:grid;place-items:center;border:1px dashed #ffeb90;color:#fff6c4;background:#062c4666;border-radius:12px;font-size:12px;font-weight:900;text-align:center;padding:3px}.phone[data-mode=before] .base{display:none}.phone[data-mode=measure] .marks{display:block}body.capture header{display:none}body.capture main{padding:0}body.capture .phone{max-width:none}
</style></head><body>
<header><h1>Основа главного экрана</h1><p>Примерка корпуса под текущую область слайма. Ниши оставлены пустыми для отдельных игровых элементов.</p><nav><button data-mode="base" aria-pressed="true">Основа</button><button data-mode="measure" aria-pressed="false">Разметка</button><button data-mode="before" aria-pressed="false">Исходный экран</button></nav></header>
<main><div class="phone" data-mode="base"><img class="before" src="../output/home-adaptation-step1/390-baseline.png" alt="Текущий главный экран"><img class="base" src="../output/home-adaptation-step1/base-v2.webp" alt="Пустая основа корпуса: место синтезатора, информация, лента эмблем, выбор мира, запуск"><div class="marks"><span style="left:3%;top:38%;width:42%;height:15%">Место синтезатора</span><span style="left:49%;top:38%;width:44%;height:15%">Название · стадия<br>Задание · прогресс</span><span style="left:17%;top:55%;width:66%;height:7%">Три эмблемы</span><span style="left:11%;top:66%;width:78%;height:18%">Выбор мира</span><span style="left:15%;top:89%;width:70%;height:9%">Играть</span></div></div></main>
<script>if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.phone').dataset.mode=b.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));</script></body></html>
