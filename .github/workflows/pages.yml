name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete game release
        run: python tools/build_yandex_release.py
      - name: Verify complete runtime
        run: |
          node tools/test_runtime_asset_closure.cjs
          node tools/test_cosmos_orbit_visuals.cjs
          node tools/test_mass_effects.cjs
          node tools/test_block_break_feedback.cjs
          node --check dist/yandex/game-runtime.js
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/yandex
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
