<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Редактор секций · Мир 1</title>
  <link rel="stylesheet" href="styles.css?v=1">
  <link rel="stylesheet" href="responsive.css?v=2">
  <link rel="stylesheet" href="editor-v4.css?v=2">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html" aria-label="Вернуться в игру">←</a>
    <div><small>МИР 1 · ЗЕЛЁНЫЕ ГЛУБИНЫ</small><h1>Редактор секций</h1></div>
  </header>
  <main class="editor-main">
    <section class="panel editor-panel">
      <div class="section-heading"><div><small>ОДИН ДЛИННЫЙ ЗАБЕГ</small><h2>Создание секций</h2></div><span id="editStatus" class="edit-status">Новая секция</span></div>
      <div class="editor-layout">
        <div class="canvas-column">
          <div id="sectionGrid" class="section-grid" aria-label="Сетка секции"></div>
          <p class="grid-help">Зажми кнопку мыши и веди по клеткам. Можно также щёлкнуть и провести курсором до выхода из сетки. Правая кнопка стирает.</p>
          <div id="brushPalette" class="brush-palette" aria-label="Кисти"></div>
        </div>
        <aside class="editor-controls">
          <div class="control-row"><b>Версия</b><div id="modeTabs" class="segmented"></div></div>
          <div class="control-row"><b>Категория</b><div id="categoryTabs" class="category-tabs"></div></div>
          <div class="control-row"><b>Сложность</b><div id="difficultyButtons" class="stars"></div></div>
          <div class="control-row"><b>Рядов в секции</b><div id="widthButtons" class="width-buttons"></div></div>
          <div class="quick-actions"><button id="addBtn" class="save-new" type="button">＋ Добавить в пул</button><button id="newBtn" type="button">Новая пустая</button></div>
        </aside>
      </div>
      <div class="editor-actions">
        <button id="mirrorBtn" type="button">↔ Отразить</button>
        <button id="clearBtn" type="button">Очистить</button>
        <button id="deleteBtn" class="delete-button" type="button">Удалить выбранную</button>
        <button id="updateBtn" class="save-changes" type="button">Сохранить изменения</button>
        <button id="saveNewBtn" class="save-new" type="button">Сохранить как новую</button>
      </div>
    </section>
    <section class="panel pool-panel">
      <div class="preview-heading"><div><small>ВЫБРАННАЯ КАТЕГОРИЯ</small><h2>Секции в пуле</h2></div><span id="poolCount">0</span></div>
      <div id="savedSections" class="saved-sections" aria-label="Сохранённые секции"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../../world-catalog.js?v=24"></script>
  <script src="../../js/generation/section-catalog.js?v=13"></script>
  <script src="../../js/generation/section-catalog-v4.js?v=2"></script>
  <script src="generation.js?v=10"></script>
</body>
</html>
