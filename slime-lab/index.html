<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Макет нового слайма</title>
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <main class="slime-lab">
    <header class="lab-heading">
      <span>МАКЕТ ПЕРСОНАЖА</span>
      <h1>Новый слайм</h1>
      <p>Яркий, мягкий и похожий на живую желейку.</p>
    </header>

    <section class="preview" aria-label="Предпросмотр нового слайма">
      <canvas id="slimeCanvas" width="640" height="640" aria-label="Новый зелёный слайм"></canvas>
      <div class="floor-glow" aria-hidden="true"></div>
    </section>

    <div class="motion-controls" role="group" aria-label="Анимация слайма">
      <button type="button" data-motion="idle" aria-pressed="true">ОБЫЧНО</button>
      <button type="button" data-motion="happy" aria-pressed="false">РАДОСТЬ</button>
      <button type="button" data-motion="fall" aria-pressed="false">ПАДЕНИЕ</button>
    </div>

    <p class="hint">Слайм следит за пальцем или курсором.</p>
  </main>

  <script src="../js/rendering/slime-character-v2.js?v=1"></script>
  <script src="preview.js?v=1"></script>
</body>
</html>
